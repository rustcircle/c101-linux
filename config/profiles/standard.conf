# standard: the recommended desktop setup. All packs, delegator as main agent, PATH fix for GUI-launched apps.
DESCRIPTION=all packs, delegator main agent, login-profile PATH integration for Claude Desktop
C101_FLAGS=--user --main-agent
C101_PACKS=
PATH_INTEGRATION=1
ENVIRONMENT_D=auto
SANDBOX=0
PLAYWRIGHT_DEPS=0
