# headless: servers, WSL and SSH boxes with no Desktop. CLI only; Desktop checks and environment.d are skipped.
DESCRIPTION=CLI-only: no Desktop checks, PATH block for SSH/login shells, no environment.d
C101_FLAGS=--user --main-agent
C101_PACKS=
PATH_INTEGRATION=1
ENVIRONMENT_D=0
SANDBOX=0
PLAYWRIGHT_DEPS=0
DESKTOP_CHECKS=0
NO_SUDO=0
ASSUME_YES=0
LINK_BINS=1
CONTAINER_RUNTIME=podman
PODMAN_SERVICES=0
DOCKER_HOST_PODMAN=auto
