# headless: servers, WSL and SSH boxes with no Desktop. CLI only; Desktop checks and environment.d are skipped.
# Keys come from the environment only (no prompt); fal image generation, pre-warm, Chromium and the timer stay on.
DESCRIPTION=CLI-only: all packs with fal image generation, keys from the environment, no Desktop checks, PATH block for SSH/login shells, no environment.d
C101_FLAGS=--user --main-agent
C101_PACKS=
PATH_INTEGRATION=1
ENVIRONMENT_D=0
SANDBOX=0
PLAYWRIGHT_DEPS=0
DESKTOP_CHECKS=0
NO_SUDO=0
ASSUME_YES=0
LINK_BINS=1
CONTAINER_RUNTIME=podman
PODMAN_SERVICES=0
DOCKER_HOST_PODMAN=auto
PRESET=everything
KEYS=env
IMAGE_BACKEND=fal
FAL_MCP=1
PREWARM_MCP=1
PLAYWRIGHT_BROWSER=1
LEARN_TIMER=1
