# ci: unattended and unprivileged. No prompts, privileged commands are printed instead of run, no Desktop,
# no profile files. c101 core pack only so a run stays fast.
DESCRIPTION=unattended: --yes --no-sudo, core pack, no Desktop checks, no profile or environment.d files
C101_FLAGS=--user
C101_PACKS=core
PATH_INTEGRATION=0
ENVIRONMENT_D=0
SANDBOX=0
PLAYWRIGHT_DEPS=0
DESKTOP_CHECKS=0
NO_SUDO=1
ASSUME_YES=1
LINK_BINS=0
CONTAINER_RUNTIME=podman
PODMAN_SERVICES=0
DOCKER_HOST_PODMAN=auto
