# minimal: the smallest footprint. c101 core plus the image preset (image + graphic-design packs) with the fal image
# backend, c101's main use; c101's research servers (exa, jina, spider, fetch, context7) are registered as always.
# The fal-runner agent is linked and fetch/neural-memory are pre-warmed; no shell-profile edits, no systemd units.
DESCRIPTION=c101 core + image and graphic-design packs with fal image generation (key: FAL_KEY in ~/.claude/stack.env), fal-runner agent, MCP pre-warm; no shell-profile or systemd changes
C101_FLAGS=--user
C101_PACKS=core
PATH_INTEGRATION=0
ENVIRONMENT_D=0
SANDBOX=0
PLAYWRIGHT_DEPS=0
DESKTOP_CHECKS=1
NO_SUDO=0
ASSUME_YES=0
LINK_BINS=0
CONTAINER_RUNTIME=podman
PODMAN_SERVICES=0
DOCKER_HOST_PODMAN=auto
PRESET=image
KEYS=auto
IMAGE_BACKEND=fal
FAL_MCP=1
PREWARM_MCP=1
PLAYWRIGHT_BROWSER=0
LEARN_TIMER=0
