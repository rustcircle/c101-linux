# full: every c101 feature that can run on Linux: all packs, --user (agents, skills, workflows, hooks, learning,
# all lazily loaded MCP servers), delegator main agent, enforced tier models, rootless-podman desktop-sandbox image,
# Playwright system libraries, claude-stack/stack-sdk on PATH, fal image generation, MCP pre-warm, Playwright's
# Chromium and the learning backstop timer. Optional extras by flag: --mcp, --managed-settings.
DESCRIPTION=all c101 features for Linux: standard (fal image generation included) + enforced tier models + podman desktop-sandbox + Playwright libs + bin links
C101_FLAGS=--user --main-agent --enforce-models
C101_PACKS=
PATH_INTEGRATION=1
ENVIRONMENT_D=auto
SANDBOX=1
PLAYWRIGHT_DEPS=1
DESKTOP_CHECKS=1
NO_SUDO=0
ASSUME_YES=0
LINK_BINS=1
CONTAINER_RUNTIME=podman
PODMAN_SERVICES=1
DOCKER_HOST_PODMAN=auto
PRESET=everything
KEYS=auto
IMAGE_BACKEND=fal
FAL_MCP=1
PREWARM_MCP=1
PLAYWRIGHT_BROWSER=1
LEARN_TIMER=1
