# presets.conf: named agent/skill presets for install-linux.sh (--preset a,b, --pick-preset, profile key PRESET).
# Parsed by lib/presets.sh, never sourced. Whole-line '#' comments and blank lines are ignored.
#
# One preset per line:  name|packs|description
#   name         lowercase letters, digits and '-'
#   packs        comma list of c101 install packs (config/packs.json in the c101 checkout), no spaces.
#                An EMPTY list means every pack (that is what 'everything' is).
#                core is always installed, and c101 adds each pack's 'requires' itself: graphic-design needs
#                image; python, typescript and devops need coding-core; containers needs coding-core and devops.
#   description  one line, shown by the picker
#
# Presets compose: several presets and --packs are unioned; any preset with an empty list selects all packs.
# lib/packs.py checks every pack name against c101's packs.json before c101 runs.
research|core,coding-core|research, planning, review and decision agents (all in core) plus the language-agnostic coding playbooks
coding|coding-core,python,typescript,rust,cpp,go,java,kotlin,haskell,julia,devops,containers|software engineering: nine language experts, CI/CD, shell, observability, containers and Kubernetes
image|image,graphic-design|image generation and editing through fal (c101's main use), vector art, visual review and graphic design
science|mathematics,physics,quantum,computer-science,computer-graphics,julia|mathematics, physics, quantum computing, computer science, computer graphics and Julia
writing|writing|fiction and long-form writing: manuscript projects, copyediting, prose style, message checks
devops|devops,containers,python|CI/CD, shell robustness, observability, containers and Kubernetes, Python tooling
everything||every c101 pack (the default of the standard, full and headless profiles)
